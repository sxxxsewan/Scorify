name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Restore or build data and model pipeline
        run: |
          if ! dvc pull; then
            echo "DVC remote pull failed or incomplete. Generating dataset and running DVC pipeline..."
            python -c "
          import numpy as np
          import pandas as pd

          np.random.seed(42)
          n = 2000

          revol = np.random.uniform(0.0, 1.0, size=n)
          age = np.random.randint(21, 80, size=n)
          p30 = np.random.choice([0, 1, 2, 3], size=n, p=[0.7, 0.15, 0.1, 0.05])
          debt = np.random.uniform(0.0, 1.0, size=n)
          income = np.random.choice([np.nan, 2000.0, 5000.0, 10000.0, 15000.0], size=n)
          lines = np.random.randint(1, 15, size=n)
          p90 = np.random.choice([0, 1, 2, 3], size=n, p=[0.75, 0.15, 0.05, 0.05])
          real = np.random.randint(0, 5, size=n)
          p60 = np.random.choice([0, 1, 2], size=n, p=[0.8, 0.15, 0.05])
          deps = np.random.choice([np.nan, 0.0, 1.0, 2.0, 3.0], size=n)

          risk_score = (revol > 0.6).astype(int)*3 + p30*2 + p90*4 + p60*2 + (debt > 0.6).astype(int)
          prob = 1 / (1 + np.exp(-(risk_score - 3)))
          target = (np.random.uniform(0, 1, size=n) < prob).astype(int)

          df = pd.DataFrame({
              'SeriousDlqin2yrs': target,
              'RevolvingUtilizationOfUnsecuredLines': revol,
              'age': age,
              'NumberOfTime30-59DaysPastDueNotWorse': p30,
              'DebtRatio': debt,
              'MonthlyIncome': income,
              'NumberOfOpenCreditLinesAndLoans': lines,
              'NumberOfTimes90DaysLate': p90,
              'NumberRealEstateLoansOrLines': real,
              'NumberOfTime60-89DaysPastDueNotWorse': p60,
              'NumberOfDependents': deps
          })

          df.to_csv('data/raw/cs-training.csv', index_label='_c0')
          "
            python src/features/build_features.py
            python src/models/train_model.py
          fi

      - name: Run tests
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build --tag scorify:ci .
